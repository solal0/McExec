name: Build McExec (26.3)
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Validate examples and metadata
        run: python3 tools/check_examples.py
      - name: Build Fabric mod
        run: ./gradlew --no-daemon clean build --stacktrace
      - name: Upload jar and sources
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mcexec-26.3-build
          path: build/libs/*.jar
